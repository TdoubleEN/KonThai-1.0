name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checker:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -B -m unittest discover -s tests -v
